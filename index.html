<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin:0;
  padding:0;
  background:black;
  overflow:hidden;
}

.video-wrap {
  width:100vw;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:black;
}

video {
  width:100%;
  max-width:900px;
  height:auto;
  display:block;
}
</style>
</head>

<body>

<div class="video-wrap">
  <video autoplay muted loop playsinline preload="auto">
    <source src="./video.mp4" type="video/mp4">
  </video>
</div>

</body>
</html>
